# Genbrugelig deploy for Ferm-apps — kaldes fra hver apps deploy.yml via
# `uses: fermrad/AI-tools/.github/workflows/deploy-app.yml@main`.
#
# Findes fordi juni-julis deploy-udbygning kostede den samme fejlrettelse 4-5
# gange — én gang pr. app (drop -dev-suffix, NPM_TOKEN-injektion, vendor-sync,
# SSH-keepalive, public/-sync, GIT_SHA-resolution ...). Workflows var copy-pastet,
# så hver lærdom skulle genopdages i hvert repo. Her rettes den én gang.
#
# Triggerne (`on: push` med path-filtre, workflow_dispatch) bliver i den
# kaldende app — de ER app-specifikke. Alt andet parameteriseres.
#
# Tre deploy-strategier (vælges med `deploy_strategy`):
#   up-build       — compose-fil pr. miljø; `up -d --build --force-recreate
#                    --remove-orphans`; migrationer bagefter i app-containeren.
#                    (projects model — kræver eksplicit prod-compose-fil, jf.
#                    project #105/#106: orphan-oprydning sletter ellers alt
#                    der ikke står i filen.)
#   build-up       — én compose-fil; `build` (prod: --no-cache --pull, ellers
#                    --pull) og `up -d` (prod: --force-recreate) hver for sig;
#                    migrationer bagefter i app-containeren. (crm/area51.)
#   migrate-first  — byg imaget, (valgfrit) skema-drift-gate, migrér i en
#                    engangscontainer, kør app-repoets SQL-scripts, og genstart
#                    FØRST derefter — den nye kode møder aldrig en gammel
#                    database, og et tabsgivende skema stopper deployet før
#                    noget er rørt. (devhubs model, jf. devhub #25 og
#                    docs/deploy-migrations.md — den bedste; nye apps bør vælge
#                    den.)
#
# ── Hvor imaget bygges (`build_mode`) ───────────────────────────────────────
#
# Strategien ovenfor bestemmer RÆKKEFØLGEN; `build_mode` bestemmer HVOR imaget
# bygges. De to er uafhængige.
#
#   on-host   — default og hidtidig adfærd: `docker compose build` kører på
#               MÅLSERVEREN over ssh.
#   registry  — imaget bygges på runneren, pushes til ghcr.io med commit-SHA'en
#               som tag, og serveren `pull`er det.
#
# Hvorfor `registry` findes (project S-349, målt i prod 15-08-2026): et byg på
# målserveren udsulter den kørende app. Målingen var 13 minutters TOTALT udfald
# (502 på alt, også forsiden), mens kørslen stod på `Build image` — altså FØR
# `Start containers`. Nedetiden var altså ikke genstarten; den var byggeriet, og
# den kom uanset om udrulningen indeholdt en skemaændring eller kun en
# tekstrettelse. Samme klasse som area51/project S-320 på staging-boksen.
#
# `migrate-first`s løfte — "miljøet er urørt, når porten siger nej" — gælder
# SKEMAET, ikke boksen. `registry` er dét, der får løftet til også at gælde
# maskinen.
#
# Fire ting, `registry` kræver af app-repoet:
#   * Compose-servicen skal have `image: ${APP_IMAGE:-<lokalt navn>}` ved siden
#     af sin `build:`. `:-` er ikke pynt: i on-host-tilstand er APP_IMAGE tom,
#     og servicen skal da falde tilbage på det lokale navn.
#   * `GIT_SHA`/`GIT_REF` skal stå i compose-filens `environment:`, ikke kun som
#     build-args. Ét image pr. SHA genbruges på tværs af miljøer, så en værdi,
#     der er BAGT ind, ville rapportere det første bygs ref for alle senere
#     udrulninger af samme commit. Runtime-env er allerede dét, appen læser.
#   * Kaldejobbet skal have `permissions: { contents: read, packages: write }`.
#     GITHUB_TOKEN i en genbrugsworkflow arver kaldejobbets rettigheder, og uden
#     `packages: write` kan pushet ikke ske.
#   * Et NEXT_PUBLIC_*-flag, der læses i en KLIENTkomponent, inlines ved byg og
#     kan derfor ikke variere pr. miljø, når ét image deles. Læses det kun
#     server-side (som project gør), er det runtime-env og upåvirket. Tjek det,
#     før en app skifter — det ser ens ud i koden og er det ikke.
#
# `registry` kan ikke kombineres med `up-build`: dén strategi bygger på boksen
# som en del af sit `up`. Kombinationen afvises i et eget trin frem for at
# bygge på serveren i tavshed.
#
# SQL, som Prisma ikke ejer: `scripts/sql/*.sql`
#
# `prisma db push` kender ikke CHECK-constraints og triggere, og
# skema-drift-gaten ser dem heller ikke. De overlever derfor ethvert deploy —
# men de kommer aldrig af sig selv, så et nyt miljø manglede dem, indtil nogen
# huskede at køre dem i hånden. (Indeks er en anden sag: dem MODELLERER Prisma,
# så et håndlavet indeks, der ikke står i schema.prisma, kan `db push` finde på
# at droppe igen. Læg ikke indeks her uden at have tjekket netop det.)
#
# Kontrakten med app-repoet:
#   * Mappen findes på SERVEREN som `<app_dir>/scripts/sql/`, altså efter
#     rsync. For apps med `sync_path: app/` betyder det `app/scripts/sql/` i
#     repoet. Ligger filerne forkert, er trinnet en tavs no-op.
#   * Filerne køres i navnesorteret rækkefølge (LC_ALL=C), så 010-, 020- styrer
#     rækkefølgen.
#   * De køres ved HVERT deploy, i alle miljøer, og SKAL derfor være
#     idempotente (`if not exists ...`) og additive. Hver fil køres som én
#     transaktion, så en fil enten går helt igennem eller slet ikke.
#   * Ingen mappe = no-op. Ingen app i org'en havde mappen, da trinnet blev
#     indført, så det er inert, indtil nogen tager det i brug.
#   * App-repoets EGET `paths`-filter skal dække mappen, ellers udløser en ren
#     SQL-ændring intet deploy: den bliver merged grøn og ruller aldrig ud.
#     `scripts/**` dækker den (devhub, area51); `app/**` gør det for apps med
#     `sync_path: app/` (crm). Har filteret hverken, skal `scripts/sql/**`
#     tilføjes eksplicit — det manglede i project og ramte project#173 samme
#     dag, mappen blev taget i brug dér. Trinnet kan ikke selv fange det:
#     filteret bestemmer, om workflowet overhovedet starter.
#   * Trinnet rammer DB-containeren med `docker exec`, ikke gennem compose, så
#     den skal hedde det rigtige i HVERT miljø. `db_container` er prod-navnet;
#     afviger dev eller staging, skal `dev_db_container` /
#     `staging_db_container` sættes. Gør de ikke det, fejler deployet med
#     containernavnet i beskeden — det ramte projects staging og dev, indtil
#     de to inputs fandtes. Backup-trinnet vælger container efter samme regel
#     (det gjorde det IKKE før S-211, se kommentaren ved "Backup database").
#
# Secrets kommer via `secrets: inherit`. Host-secrets kan re-mappes pr. app
# (area51 bor på de interne bokse, devhubs dev på den offentlige).

name: Deploy Ferm app

on:
  workflow_call:
    inputs:
      environment:
        description: 'dev | staging | production'
        required: true
        type: string
      checkout_ref:
        description: 'Commit/branch der checkes ud og deployes'
        required: true
        type: string
      git_ref:
        description: 'Ref-navn appen rapporterer til DevHub via /api/health'
        required: true
        type: string
      app_slug:
        description: 'Kort navn — backup-filnavne og DevHub-rapportering (project, crm, ...)'
        required: true
        type: string
      app_dir:
        description: 'Deploy-mappe på serveren, fx /opt/ferm-project'
        required: true
        type: string
      sync_path:
        description: 'Lokal sti der rsync''es (crm har koden i app/)'
        required: false
        type: string
        default: '.'
      extra_excludes:
        description: 'Ekstra rsync-excludes, mellemrumssepareret'
        required: false
        type: string
        default: ''
      db_container:
        description: 'Postgres-containerens navn (til backup)'
        required: true
        type: string
      db_user:
        required: true
        type: string
      db_name:
        required: true
        type: string
      app_container:
        description: 'App-containerens navn (til migrations ved exec-strategierne)'
        required: true
        type: string
      staging_app_container:
        description: 'App-containernavn på staging, hvis det afviger'
        required: false
        type: string
        default: ''
      # db_container er PROD-navnet. Miljøerne har typisk hver sit — hos project
      # ferm-project-db (dev), ferm-project-staging-db (staging) og
      # ferm-projects-db (prod) — og SQL-trinnet rammer containeren direkte med
      # docker exec, ikke gennem compose. Uden de her to kørte det med prod-navnet
      # i alle miljøer og fejlede med "No such container" på dev og staging.
      # De bruges af BÅDE backup-trinnet og SQL-trinnene. Backup'en gjorde det
      # ikke oprindeligt: den brugte prod-navnet i alle miljøer og sprang tavst
      # over, fordi "container findes ikke" dér var en overspringning frem for
      # en fejl (S-211).
      staging_db_container:
        description: 'DB-containernavn på staging, hvis det afviger'
        required: false
        type: string
        default: ''
      dev_db_container:
        description: 'DB-containernavn på dev, hvis det afviger'
        required: false
        type: string
        default: ''
      compose_service:
        description: 'Compose-servicenavn for appen (til migrate-first run --rm)'
        required: false
        type: string
        default: 'app'
      compose_file_dev:
        required: false
        type: string
        default: 'docker-compose.dev.yml'
      compose_file_staging:
        required: false
        type: string
        default: 'docker-compose.staging.yml'
      compose_file_production:
        # Default docker-compose.yml er typisk LOKAL DEV (kun db). Uden eksplicit
        # prod-fil slettede --remove-orphans den håndkørte prod-app som orphan
        # (project #105, incident 2026-07-17). Derfor er prod-filen et krav om
        # at være eksplicit — ingen falder tilbage til docker-compose.yml.
        required: false
        type: string
        default: 'docker-compose.production.yml'
      deploy_strategy:
        description: 'up-build | build-up | migrate-first (se toppen af filen)'
        required: false
        type: string
        default: 'up-build'
      build_mode:
        # on-host er den hidtidige adfærd og forbliver default — ingen app
        # skifter, før den selv beder om det.
        description: 'on-host | registry — hvor imaget bygges (se "Hvor imaget bygges" øverst)'
        required: false
        type: string
        default: 'on-host'
      image_name:
        description: 'Registry-image UDEN tag. Tom = ghcr.io/<owner>/<repo> for det KALDENDE repo.'
        required: false
        type: string
        default: ''
      build_args:
        # GIT_SHA og GIT_REF sættes altid af workflowet selv — skriv dem ikke her.
        description: 'Ekstra build-args ved registry-byg, én KEY=VALUE pr. linje'
        required: false
        type: string
        default: ''
      schema_drift_gate:
        description: 'Stop deployet hvis skemaændringen er tabsgivende (kræver scripts/schema-drift.mjs i app-repoet; kun migrate-first)'
        required: false
        type: boolean
        default: false
      tailscale:
        description: 'always | dev-only | never — hvornår runneren skal på tailnettet'
        required: false
        type: string
        default: 'always'
      dev_host_secret:
        description: 'Navn på org-secret med dev-boksens host'
        required: false
        type: string
        default: 'INTERNAL_DEV_SSH_HOST'
      staging_host_secret:
        required: false
        type: string
        default: 'STAGING_SSH_HOST'
      production_host_secret:
        required: false
        type: string
        default: 'PRODUCTION_SSH_HOST'
      reload_caddy:
        description: 'never | non-dev | always — genindlæs ferm-caddy efter deploy'
        required: false
        type: string
        default: 'never'
      ensure_dev_dir:
        description: 'Sikr app-mappe + symlink på dev-boksens persistente volume'
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      # Kørende git-ref (branch/tag) — sendes videre til build, så appen kan
      # rapportere referencen (aflæses af DevHub via /api/health). GIT_SHA sættes
      # separat efter checkout, se trinnet nedenfor.
      GIT_REF: ${{ inputs.git_ref }}
      HOST: ${{ inputs.environment == 'production' && secrets[inputs.production_host_secret] || inputs.environment == 'dev' && secrets[inputs.dev_host_secret] || secrets[inputs.staging_host_secret] }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.checkout_ref }}

      # github.sha er tom ved workflow_dispatch (måden prod deployes på), så
      # GIT_SHA ville blive branch-navnet i stedet for commit'en. Læs derfor den
      # faktisk udcheckede commit, så /api/health rapporterer korrekt SHA til DevHub.
      - name: Resolve deployed commit SHA
        run: echo "GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Kombinationen kan ikke lade sig gøre: up-build bygger på boksen som en
      # del af sit `up -d --build`, altså præcis dét, registry findes for at
      # undgå. Sig fra HER frem for at bygge på serveren i tavshed — en
      # opsætningsfejl, der ligner en virkende udrulning, er den dyre slags.
      - name: Gate — registry-byg kræver en strategi, der ikke bygger på boksen
        if: inputs.build_mode == 'registry' && inputs.deploy_strategy == 'up-build'
        run: |
          echo "::error title=build_mode=registry kan ikke kombineres med deploy_strategy=up-build::up-build kører 'docker compose up -d --build' på målserveren og bygger altså imaget dér, uanset at det også er bygget og pushet i CI. Vælg build-up eller migrate-first."
          exit 1

      # Imagets navn OG tag. Tagget er commit-SHA'en — S-349 kræver, at imaget
      # versioneres pr. SHA, så en udrulning kan pege på præcis den commit, den
      # bygger på, og en tilbagerulning kan hente et image, der allerede findes.
      #
      # ghcr kræver småt image-navn; org- og repo-navne må gerne have store
      # bogstaver, så navnet foldes ned frem for at fejle inde i docker.
      - name: Resolve image reference
        if: inputs.build_mode == 'registry'
        run: |
          NAME="${{ inputs.image_name }}"
          NAME="${NAME,,}"   # ghcr kræver småt; fold BEGGE veje, ikke kun default-navnet
          if [ -z "$NAME" ]; then
            # github.repository er det KALDENDE repo (fermrad/project), ikke
            # AI-tools — genbrugsworkflows kører i kalderens kontekst. Det er
            # også dét, der gør, at kalderens GITHUB_TOKEN kan pushe pakken.
            NAME="ghcr.io/${GITHUB_REPOSITORY,,}"
          fi
          echo "APP_IMAGE=${NAME}:${GIT_SHA}" >> "$GITHUB_ENV"
          echo "Image: ${NAME}:${GIT_SHA}"

      # Compose-flag pr. miljø én gang for alle trin.
      - name: Resolve compose file
        run: |
          if [[ "$DEPLOY_ENV" == "dev" ]]; then
            echo "COMPOSE_FLAGS=-f ${{ inputs.compose_file_dev }}" >> "$GITHUB_ENV"
          elif [[ "$DEPLOY_ENV" == "staging" ]]; then
            echo "COMPOSE_FLAGS=-f ${{ inputs.compose_file_staging }}" >> "$GITHUB_ENV"
          else
            echo "COMPOSE_FLAGS=-f ${{ inputs.compose_file_production }}" >> "$GITHUB_ENV"
          fi

      # ── Registry-byg: alt her kører på RUNNEREN ────────────────────────────
      # Placeret FØR tailscale/ssh/backup med vilje. Et byg, der ikke kan lade
      # sig gøre, skal fejle uden at have rørt målserveren overhovedet — i
      # on-host-tilstand var en fejlende build allerede efter rsync, altså efter
      # at koden var lagt ud på boksen.
      # Findes tagget allerede, bygges der IKKE om — der pulles bare.
      #
      # Det er dét, der gør en tilbagerulning til en gammel SHA til en HENTNING
      # af nøjagtig det image, der kørte dengang. Uden tjekket ville
      # rollback-vejen bygge commit'en forfra og PUSHE oven i sit eget tag: ghcr
      # har mutable tags, `FROM node:20-bullseye-slim` er et flydende tag, og
      # `npm ci` opløser mod det levende register — så "rul tilbage til X" ville
      # give "X's kildekode bygget I DAG", ikke det image, der kørte. Det er den
      # slags forskel, man opdager midt i et nedbrud.
      #
      # Sidegevinst: en udrulning, der døde i drift-gaten, efterlader et tag i
      # registret. Uden tjekket ville et senere byg af samme SHA overskrive det
      # med noget andet; med tjekket er tagget stabilt fra første push.
      - name: Does the image already exist?
        if: inputs.build_mode == 'registry'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rent læse-opslag mod registret — kræver ingen buildx og intet byg.
          if echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin >/dev/null 2>&1 \
             && docker manifest inspect "$APP_IMAGE" >/dev/null 2>&1; then
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
            echo "$APP_IMAGE findes allerede — springer byg og push over."
          else
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
            echo "$APP_IMAGE findes ikke — bygges."
          fi

      - name: Set up Buildx
        if: inputs.build_mode == 'registry' && env.IMAGE_EXISTS != 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io (runner)
        if: inputs.build_mode == 'registry' && env.IMAGE_EXISTS != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Kørslens EGET, kortlivede token — ikke en PAT i en org-secret. Det
          # udløber med kørslen, så der ligger ingen blivende registry-nøgle
          # nogen steder, og rettighederne kommer fra kaldejobbets `permissions`.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: inputs.build_mode == 'registry' && env.IMAGE_EXISTS != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.sync_path }}
          push: true
          tags: ${{ env.APP_IMAGE }}
          # GIT_SHA/GIT_REF sendes med, så et image, der køres UDEN
          # runtime-env, stadig kan sige hvad det er. Runtime-env vinder —
          # se noten om `environment:` øverst i filen.
          #
          # Læg ALDRIG en hemmelighed her: build-args interpoleres synligt i
          # kørselsloggen og følger med i imagets metadata. Skal et byg bruge en
          # hemmelighed (crm's NPM_TOKEN er det eneste tilfælde i huset i dag),
          # kræver det `secrets:` + `--mount=type=secret` i Dockerfilen — og dét
          # findes ikke her endnu. Det er derfor, crm ikke kan skifte til
          # registry uden videre.
          build-args: |
            GIT_SHA=${{ env.GIT_SHA }}
            GIT_REF=${{ env.GIT_REF }}
            ${{ inputs.build_args }}
          # PRODUKTION BYGGER RENT. On-host-vejen har altid sendt
          # `--no-cache --pull` for prod (se "Build image" nedenfor), og den
          # hygiejne må ikke falde bort, bare fordi bygget flyttede.
          #
          # Uden den ville prod-imaget kunne samles af lag, en dev- eller
          # staging-kørsel har lagt i cachen: `Deploy project` kan dispatches med
          # `environment: dev` og en VILKÅRLIG ref, og med `mode=max` eksporteres
          # hvert mellemlag. Den næste prod-udrulning ville så restore dem — en
          # rute fra en uskyldigt udseende dev-dispatch ind i prod-imaget, hvor
          # selve prod-kørslen ser helt normal ud.
          no-cache: ${{ inputs.environment == 'production' }}
          pull: ${{ inputs.environment == 'production' }}
          # Og cachen er pr. app OG MILJØ. Et fælles scope ville lade de to
          # miljøer skrive i hinandens cache — samme rute som ovenfor, bare uden
          # at nogen behøvede at dispatche noget.
          cache-from: type=gha,scope=${{ inputs.app_slug }}-${{ inputs.environment }}
          cache-to: ${{ inputs.environment == 'production' && '' || format('type=gha,mode=max,scope={0}-{1}', inputs.app_slug, inputs.environment) }}

      - name: Connect to Tailscale
        if: inputs.tailscale == 'always' || (inputs.tailscale == 'dev-only' && inputs.environment == 'dev')
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          authkey: ${{ secrets.TAILSCALE_CI_AUTH_KEY }}

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Retry-loop fra area51: Tailscale-ruten til interne bokse kan være
          # sekunder om at komme op — første keyscan må ikke være dødsdommen.
          # På offentlige bokse rammer første forsøg.
          #
          # Løkken SKAL sige fra, når den løber tør. Uden `exit 1` returnerede
          # trinnet `success`, selv når ruten aldrig kom op — og fejlen dukkede
          # så op ~2 minutter senere som `ssh: connect to host … port 22:
          # Connection timed out` i et trin, der hedder "Ensure app directory
          # exists on persistent volume". Det læser som en disk- eller
          # rettighedsfejl, ikke som en netværksfejl, og kostede reel
          # fejlsøgningstid i project S-290 (kørsel 31412821397).
          for i in $(seq 1 18); do
            ssh-keyscan -T 5 -H "$HOST" 2>/dev/null | tee -a ~/.ssh/known_hosts | grep -q . && break
            if [ "$i" -eq 18 ]; then
              echo "::error title=Ingen rute til $DEPLOY_ENV-boksen::ssh-keyscan nåede aldrig $DEPLOY_ENV-hosten på 18 forsøg (~3 min). Runneren er på tailnettet, men boksen svarer ikke — typisk fordi tailscaled på boksen er sultet af CPU/hukommelse, eller fordi boksen er nede. Se journalctl -u tailscaled på boksen omkring dette tidspunkt."
              exit 1
            fi
            echo "Attempt $i/18 — waiting for route…"
            sleep 5
          done

      - name: Ensure app directory exists on persistent volume
        if: env.DEPLOY_ENV == 'dev' && inputs.ensure_dev_dir
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" "
            mkdir -p /mnt/ferm-data${{ inputs.app_dir }}/pgdata
            mkdir -p /mnt/ferm-data${{ inputs.app_dir }}/data
            if [ ! -L ${{ inputs.app_dir }} ]; then
              rm -rf ${{ inputs.app_dir }}
              ln -sf /mnt/ferm-data${{ inputs.app_dir }} ${{ inputs.app_dir }}
            fi
          "

      - name: Backup database
        if: env.DEPLOY_ENV != 'dev'
        # Trinnet valgte før db_container UBETINGET — altså prod-navnet, også på
        # staging. SQL-trinnet nedenfor valgte allerede rigtigt mellem de tre
        # inputs; backup'en brugte bare ikke mekanismen. Resultatet: projects
        # staging ledte efter ferm-projects-db, fandt den ikke (den hedder
        # ferm-project-staging-db), skrev "(første deploy?)" og gik grønt —
        # gennem 210 push-deploys uden backup mellem 16-07 og 08-08-2026 (S-211).
        #
        # Derfor skelner trinnet nu mellem to slags "ingen backup", som før så ens ud:
        #   * INGEN db-container for appen kører        → ægte førstedeploy, spring over (exit 0).
        #   * Containeren findes under et ANDET navn,
        #     eller findes og er stoppet                → opsætningsfejl, stop deployet (exit 1)
        #                                                 FØR det rører databasen.
        # "Er navnet konfigureret?" duer ikke som skel: crm og devhub sætter
        # ingen override (deres staging-db hedder tilfældigvis det samme som
        # prods), så en fremtidig omdøbning dér ville give præcis S-211 igen uden
        # at nogen havde konfigureret noget forkert. Beviset skal komme fra
        # maskinen, ikke fra inputtet.
        #
        # En pg_dump der FEJLER er heller ikke en gyldig overspringning: uden
        # pipefail returnerer `pg_dump | gzip > fil` 0 og efterlader en ~20 bytes
        # tom .gz, og deployet ruller videre i troen på at der er taget backup.
        # Hærdet udgave fra infrastructure-templaten (#214).
        run: |
          BACKUP_DIR=$([[ "$DEPLOY_ENV" == "production" ]] && echo "/var/backups/prod" || echo "/var/backups/staging")
          BACKUP_LABEL=$([[ "$DEPLOY_ENV" == "production" ]] && echo "prod" || echo "staging")
          # db_container er prod-navnet; dev og staging har typisk hver sit.
          # Samme mønster som "Run SQL scripts" — rettes den ene, skal den anden med.
          DB_CONTAINER="${{ inputs.db_container }}"
          if [[ "$DEPLOY_ENV" == "staging" && -n "${{ inputs.staging_db_container }}" ]]; then
            DB_CONTAINER="${{ inputs.staging_db_container }}"
          elif [[ "$DEPLOY_ENV" == "dev" && -n "${{ inputs.dev_db_container }}" ]]; then
            DB_CONTAINER="${{ inputs.dev_db_container }}"
          fi
          # MODE=skip-if-absent: et deploy af en app, der ikke er sat op endnu,
          # skal kunne køre igennem. Den planlagte backup (backup-db.yml) sender
          # MODE=require i stedet — dér betyder "ingen database" ikke
          # førstedeploy, men at en app i drift er væk, og det skal larme.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            bash -s -- "$BACKUP_DIR" "$BACKUP_LABEL" "$DB_CONTAINER" \
                       "${{ inputs.app_slug }}" "${{ inputs.db_user }}" "${{ inputs.db_name }}" \
                       skip-if-absent << 'REMOTE'
          set -euo pipefail
          BACKUP_DIR="$1"; BACKUP_LABEL="$2"; DB_CONTAINER="$3"
          APP_SLUG="$4"; DB_USER="$5"; DB_NAME="$6"; MODE="${7:-skip-if-absent}"

          # Læs listen ÉN gang i en variabel og match med here-strings.
          # `docker ps | grep -q` er ikke sikkert her: grep -q afslutter ved
          # første match, docker kan nå at få SIGPIPE, og med `pipefail` bliver
          # hele pipelinen så non-zero — altså ser en KØRENDE container fraværende
          # ud. Det er sjældent og tidsafhængigt, og netop derfor uacceptabelt i
          # et trin, hvis eneste opgave er at afgøre præcis det spørgsmål.
          RUNNING="$(docker ps --format '{{.Names}}')"

          if ! grep -qxF "$DB_CONTAINER" <<< "$RUNNING"; then
            # Kører en ANDEN db-container for appen? Så er navnet forkert for
            # dette miljø — netop S-211 — og det skal larme, ikke springes over.
            # Slug'en matches med index(), ikke som regex, så et punktum eller
            # plus i et app_slug ikke stille udvider hvad der tæller som match.
            # Det tjek kommer FØRST: står der en gammel, stoppet container under
            # prod-navnet, mens den rigtige kører under et andet, er "du har
            # peget på det forkerte navn" den brugbare besked — ikke "start den".
            OTHERS="$(awk -v s="$APP_SLUG" 'index($0, s) && /-db$/' <<< "$RUNNING")"
            if [ -n "$OTHERS" ]; then
              echo "DB-containeren '$DB_CONTAINER' kører ikke, men disse db-containere for '$APP_SLUG' gør:" >&2
              sed 's/^/  /' <<< "$OTHERS" >&2
              echo "Miljøet ($BACKUP_LABEL) peger på det forkerte navn — ingen backup taget, deployet stoppet." >&2
              echo "Sæt staging_db_container / dev_db_container i appens deploy.yml." >&2
              exit 1
            fi
            # Findes den, men kører ikke? Så er stakken sat op før, og det er
            # ikke et førstedeploy — det er en nede database.
            if grep -qxF "$DB_CONTAINER" <<< "$(docker ps -a --format '{{.Names}}')"; then
              echo "DB-containeren '$DB_CONTAINER' findes, men kører ikke — kan ikke tage backup." >&2
              echo "Start den (docker start $DB_CONTAINER) og kør deployet igen." >&2
              exit 1
            fi
            # Ingen db-container for appen overhovedet: stakken findes ikke endnu.
            # Ved et deploy er det et førstedeploy og helt i orden. Ved en
            # PLANLAGT backup er det ikke: appen er i drift, og at dens database
            # ikke kører er præcis det, en backup-cron skal opdage. Samme tekst
            # ville dér betyde "alt vel" om noget, der er galt.
            if [ "$MODE" = "require" ]; then
              echo "Ingen kørende db-container for '$APP_SLUG' ('$DB_CONTAINER' findes ikke)." >&2
              echo "Ved en planlagt backup er det ikke et førstedeploy — der blev ikke taget backup." >&2
              exit 1
            fi
            echo "Ingen kørende db-container for '$APP_SLUG' ('$DB_CONTAINER' findes ikke) — førstedeploy, springer backup over."
            exit 0
          fi

          mkdir -p "$BACKUP_DIR"
          OUT="${BACKUP_DIR}/${APP_SLUG}-${BACKUP_LABEL}-$(date +%Y%m%d_%H%M%S).sql.gz"
          docker exec "$DB_CONTAINER" pg_dump -U "$DB_USER" "$DB_NAME" | gzip > "$OUT"
          # gzip af en tom stream giver stadig ~20 bytes — tjek indholdet, ikke filen.
          if [ "$(gzip -dc "$OUT" | head -c 1 | wc -c)" -eq 0 ]; then
            echo "Backup $OUT er tom — pg_dump gav intet output" >&2
            exit 1
          fi
          echo "Backup: $OUT ($(du -h "$OUT" | cut -f1))"
          REMOTE

      - name: rsync app to server
        run: |
          EXTRA_EXCLUDES=""
          for e in ${{ inputs.extra_excludes }}; do
            EXTRA_EXCLUDES="$EXTRA_EXCLUDES --exclude $e"
          done
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.git' \
            --exclude '.env*' \
            --exclude '.DS_Store' \
            $EXTRA_EXCLUDES \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            ${{ inputs.sync_path }} \
            "root@${HOST}:${{ inputs.app_dir }}/"

      # ── Strategi: up-build ──────────────────────────────────────────────────
      - name: Build and restart containers
        if: inputs.deploy_strategy == 'up-build'
        env:
          # NPM_READ_TOKEN er org'ens levende læse-token; NPM_TOKEN døde udløbet
          # 2026-07-23 og gav 401 i crm's build (eneste app der rammer registret
          # — resten vendorer). Shell-navnet forbliver NPM_TOKEN, for det er det
          # Dockerfiles/.npmrc forventer.
          NPM_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@${HOST}" \
            "docker network create ferm-net 2>/dev/null || true && cd ${{ inputs.app_dir }} && export GIT_SHA='${GIT_SHA}' GIT_REF='${GIT_REF}' && NPM_TOKEN='${NPM_TOKEN}' docker compose ${COMPOSE_FLAGS} up -d --build --force-recreate --remove-orphans"

      # ── Strategier: build-up og migrate-first ───────────────────────────────
      # Bygger kun imaget. Ved migrate-first hænger den kørende container på sit
      # gamle image-ID og røres ikke endnu.
      - name: Build image
        if: inputs.deploy_strategy != 'up-build' && inputs.build_mode != 'registry'
        env:
          # NPM_READ_TOKEN er org'ens levende læse-token; NPM_TOKEN døde udløbet
          # 2026-07-23 og gav 401 i crm's build (eneste app der rammer registret
          # — resten vendorer). Shell-navnet forbliver NPM_TOKEN, for det er det
          # Dockerfiles/.npmrc forventer.
          NPM_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.NPM_TOKEN }}
        run: |
          BUILD_FLAGS=$([[ "$DEPLOY_ENV" == "production" ]] && echo "--no-cache --pull" || echo "--pull")
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@${HOST}" \
            "docker network create ferm-net 2>/dev/null || true && cd ${{ inputs.app_dir }} && export GIT_SHA='${GIT_SHA}' GIT_REF='${GIT_REF}' && NPM_TOKEN='${NPM_TOKEN}' docker compose ${COMPOSE_FLAGS} build ${BUILD_FLAGS}"

      # ── Registry: hent imaget i stedet for at bygge det ────────────────────
      # Erstatter trinnet ovenfor. Nedetiden falder fra "byggeriet udsulter
      # boksen" til "et pull, mens den gamle container kører videre".
      #
      # Login, pull og oprydning ligger i ÉT trin med vilje. Nøglen skal ligge
      # på maskinen i så kort tid som muligt, og alt efter pullet (drift-gate,
      # db push, `up -d`) bruger et image, der allerede er lokalt —
      # registret er der ikke brug for igen. Lå oprydningen til sidst i jobbet,
      # var vinduet hele udrulningen i stedet for de sekunder, et pull tager.
      #
      # Tre ting om hemmeligheden, og de er alle tre bevidste:
      #   * Tokenet går over STDIN, aldrig i argv — en kommandolinje kan læses
      #     af enhver med adgang til boksens procesliste.
      #   * EGEN docker-config-mappe pr. app (`DOCKER_CONFIG`). Boksene deles:
      #     dev kører project + crm + area51, og `concurrency`-gruppen er pr.
      #     app, så to udrulninger kan overlappe. Med den fælles
      #     /root/.docker/config.json ville den enes `docker logout` rive den
      #     andens nøgle væk MIDT i et pull — en flaky 401, ingen kunne
      #     forklare — og mens begge var logget ind, ville den sidste login
      #     gælde for dem begge.
      #   * Mappen SLETTES frem for at blive `docker logout`'et. En sletning kan
      #     ikke efterlade en post, og `trap` sikrer, at den også sker, når
      #     pullet fejler.
      - name: Pull image on server
        if: inputs.build_mode == 'registry'
        env:
          # Via `env:` frem for `${{ }}` direkte i kommandostrengen. Actions
          # interpolerer `${{ }}` som TEKST, før bash ser linjen, så en værdi med
          # et citationstegn ville kunne bryde ud og køre som root på boksen.
          # Som miljøvariabler udvides de af runnerens bash i stedet.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ inputs.app_dir }}
          ACTOR: ${{ github.actor }}
          SERVICE: ${{ inputs.compose_service }}
          SLUG: ${{ inputs.app_slug }}
        run: |
          # Tokenet er det eneste, der går over stdin — `docker login
          # --password-stdin` er den første og eneste læser.
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@${HOST}" \
            "set -e
             export DOCKER_CONFIG=/root/.docker-deploy-${SLUG}
             trap 'rm -rf \"\$DOCKER_CONFIG\"' EXIT
             install -d -m 700 \"\$DOCKER_CONFIG\"
             docker login ghcr.io -u '${ACTOR}' --password-stdin
             docker network create ferm-net 2>/dev/null || true
             cd '${APP_DIR}'
             export APP_IMAGE='${APP_IMAGE}'
             docker compose ${COMPOSE_FLAGS} pull '${SERVICE}'
             # Imaget SKAL ligge lokalt nu. Uden den her påstand ville et pull,
             # der ikke gav det forventede tag, først vise sig i drift-gaten —
             # hvor \`docker compose run\` BYGGER imaget af sig selv, hvis det
             # mangler. Altså præcis den nedetid, S-349 fjerner, på det trin der
             # er sværest at få øje på.
             #
             # Påstanden og ikke et \`--no-build\`-flag: \`docker compose run\`
             # kender ikke det flag (målt 15-08-2026: 'unknown flag: --no-build'
             # på staging-boksen) — kun \`up\` gør. En eksistenspåstand virker
             # på enhver compose-version og fejler DESUDEN tidligere.
             docker image inspect '${APP_IMAGE}' >/dev/null"

      # Porten (devhub #25). Diff'en beregnes med det NYE image (skemaet er bagt
      # ind) mod den KØRENDE database. Er ændringen tabsgivende, dør deployet her
      # — før noget er genstartet.
      - name: Gate — schema drift må ikke være tabsgivende
        if: inputs.deploy_strategy == 'migrate-first' && inputs.schema_drift_gate
        run: |
          # APP_IMAGE eksporteres i HVERT compose-kald, ikke kun ved pull.
          # Compose-servicen slår op i `${APP_IMAGE:-<lokalt navn>}`, så en
          # glemt eksport ville tavst køre engangscontaineren på det GAMLE,
          # lokale image — altså regne driften på et andet skema end det, der
          # skal rulles ud. I on-host-tilstand er variablen tom, og `:-`
          # leverer det lokale navn som hidtil.
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            "cd ${{ inputs.app_dir }} && export APP_IMAGE='${APP_IMAGE}' && \
             docker compose ${COMPOSE_FLAGS} run --rm ${{ inputs.compose_service }} \
               npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --script" \
            > drift.sql
          echo "::group::Skema-drift ($DEPLOY_ENV)"
          cat drift.sql
          echo "::endgroup::"
          node scripts/schema-drift.mjs < drift.sql

      # Migrér FØR genstart i en engangscontainer — den kørende container er urørt.
      - name: Run DB migrations (before restart)
        if: inputs.deploy_strategy == 'migrate-first'
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            "cd ${{ inputs.app_dir }} && export APP_IMAGE='${APP_IMAGE}' && \
             docker compose ${COMPOSE_FLAGS} run --rm ${{ inputs.compose_service }} \
               npx prisma db push"

      # Umiddelbart efter db push og FØR genstart — samme grund som selve
      # migrate-first-strategien: den nye kode må aldrig møde et halvfærdigt
      # skema. En CHECK-constraint er skemaarbejde på lige fod med en kolonne.
      #
      # NB: body'en er med vilje IDENTISK med "Run SQL scripts" nedenfor. De to
      # kan ikke slås sammen (de skal ligge hver sit sted i rækkefølgen), og et
      # composite action ville koste mere end de sparer: runneren henter ALLE
      # actions i "Set up job", før noget `if:` er evalueret, så en
      # `uses: ...@main` ville dels ikke kunne testes fra en branch (den findes
      # først på main efter merge), dels vælte hver eneste apps deploy — også
      # dem uden scripts/sql — hvis mappen nogensinde blev flyttet. Rettes den
      # ene, skal den anden med.
      - name: Run SQL scripts (before restart)
        if: inputs.deploy_strategy == 'migrate-first'
        run: |
          # db_container er prod-navnet; dev og staging har typisk hver sit.
          DB_CONTAINER="${{ inputs.db_container }}"
          if [[ "$DEPLOY_ENV" == "staging" && -n "${{ inputs.staging_db_container }}" ]]; then
            DB_CONTAINER="${{ inputs.staging_db_container }}"
          elif [[ "$DEPLOY_ENV" == "dev" && -n "${{ inputs.dev_db_container }}" ]]; then
            DB_CONTAINER="${{ inputs.dev_db_container }}"
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            bash -s -- "${{ inputs.app_dir }}" "$DB_CONTAINER" \
                       "${{ inputs.db_user }}" "${{ inputs.db_name }}" << 'REMOTE'
          set -euo pipefail
          APP_DIR="$1"; DB_CONTAINER="$2"; DB_USER="$3"; DB_NAME="$4"
          SQL_DIR="$APP_DIR/scripts/sql"

          if [ ! -d "$SQL_DIR" ]; then
            echo "Ingen $SQL_DIR — intet SQL at køre."
            exit 0
          fi

          # nullglob: en tom mappe skal give en tom liste, ikke den bogstavelige
          # streng "*.sql", som psql så ville fejle på.
          shopt -s nullglob
          FILES=("$SQL_DIR"/*.sql)
          shopt -u nullglob

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Ingen .sql-filer i $SQL_DIR — intet at køre."
            exit 0
          fi

          # Først her: apps uden scripts/sql skal ikke fejle på en container,
          # de aldrig får brug for.
          if ! docker inspect "$DB_CONTAINER" >/dev/null 2>&1; then
            echo "DB-containeren '$DB_CONTAINER' findes ikke i dette miljø."
            echo "Sæt dev_db_container / staging_db_container i appens deploy.yml."
            exit 1
          fi

          # LC_ALL=C: samme rækkefølge uanset serverens locale, så et 010-/020-
          # præfiks også styrer rækkefølgen på en boks med andet sprog.
          IFS=$'\n' FILES=($(printf '%s\n' "${FILES[@]}" | LC_ALL=C sort))

          for f in "${FILES[@]}"; do
            echo "── $(basename "$f")"
            # ON_ERROR_STOP=1 er IKKE valgfri: uden den fortsætter psql efter en
            # fejl og afslutter med 0, så et brækket script ville rulle videre
            # som om alt gik godt — endnu et falsk-grønt signal.
            # --single-transaction gør hver fil atomisk, så et script der fejler
            # halvvejs ikke efterlader sine første statements committet.
            docker exec -i "$DB_CONTAINER" \
              psql -v ON_ERROR_STOP=1 --single-transaction -U "$DB_USER" -d "$DB_NAME" < "$f"
          done

          echo "${#FILES[@]} SQL-script(s) kørt."
          REMOTE

      - name: Start containers
        if: inputs.deploy_strategy != 'up-build'
        run: |
          UP_FLAGS=$([[ "$DEPLOY_ENV" == "production" ]] && echo "--force-recreate" || echo "")
          # Bemærk: intet `--no-build` her. Værnet mod et tavst on-host-byg er
          # eksistenspåstanden i "Pull image on server" — den virker på enhver
          # compose-version og fejler tidligere. Se noten dér.
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "root@${HOST}" \
            "cd ${{ inputs.app_dir }} && export GIT_SHA='${GIT_SHA}' GIT_REF='${GIT_REF}' APP_IMAGE='${APP_IMAGE}' && docker compose ${COMPOSE_FLAGS} up -d ${UP_FLAGS}"

      # Kør db push INDE i app-containeren: dér findes den pinnede prisma-CLI,
      # prisma.config.ts og DATABASE_URL allerede. En nøgen node-container har
      # ingen node_modules, så npx trækker nyeste prisma — og en major-version
      # kan (og har) brækket deployet tavst.
      - name: Run DB migrations
        if: inputs.deploy_strategy != 'migrate-first'
        run: |
          APP_CONTAINER="${{ inputs.app_container }}"
          if [[ "$DEPLOY_ENV" == "staging" && -n "${{ inputs.staging_app_container }}" ]]; then
            APP_CONTAINER="${{ inputs.staging_app_container }}"
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            "docker exec ${APP_CONTAINER} npx prisma db push"

      # De gamle strategier migrerer først EFTER genstart — det er hele grunden
      # til at migrate-first findes. SQL'en følger db push, hvor den nu end
      # ligger, så rækkefølgen skema-før-SQL holder i begge tilfælde.
      # Identisk body med "Run SQL scripts (before restart)" ovenfor — se noten
      # dér om hvorfor de to ikke er ét composite action.
      - name: Run SQL scripts
        if: inputs.deploy_strategy != 'migrate-first'
        run: |
          # db_container er prod-navnet; dev og staging har typisk hver sit.
          DB_CONTAINER="${{ inputs.db_container }}"
          if [[ "$DEPLOY_ENV" == "staging" && -n "${{ inputs.staging_db_container }}" ]]; then
            DB_CONTAINER="${{ inputs.staging_db_container }}"
          elif [[ "$DEPLOY_ENV" == "dev" && -n "${{ inputs.dev_db_container }}" ]]; then
            DB_CONTAINER="${{ inputs.dev_db_container }}"
          fi
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            bash -s -- "${{ inputs.app_dir }}" "$DB_CONTAINER" \
                       "${{ inputs.db_user }}" "${{ inputs.db_name }}" << 'REMOTE'
          set -euo pipefail
          APP_DIR="$1"; DB_CONTAINER="$2"; DB_USER="$3"; DB_NAME="$4"
          SQL_DIR="$APP_DIR/scripts/sql"

          if [ ! -d "$SQL_DIR" ]; then
            echo "Ingen $SQL_DIR — intet SQL at køre."
            exit 0
          fi

          shopt -s nullglob
          FILES=("$SQL_DIR"/*.sql)
          shopt -u nullglob

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Ingen .sql-filer i $SQL_DIR — intet at køre."
            exit 0
          fi

          # Først her: apps uden scripts/sql skal ikke fejle på en container,
          # de aldrig får brug for.
          if ! docker inspect "$DB_CONTAINER" >/dev/null 2>&1; then
            echo "DB-containeren '$DB_CONTAINER' findes ikke i dette miljø."
            echo "Sæt dev_db_container / staging_db_container i appens deploy.yml."
            exit 1
          fi

          IFS=$'\n' FILES=($(printf '%s\n' "${FILES[@]}" | LC_ALL=C sort))

          for f in "${FILES[@]}"; do
            echo "── $(basename "$f")"
            docker exec -i "$DB_CONTAINER" \
              psql -v ON_ERROR_STOP=1 --single-transaction -U "$DB_USER" -d "$DB_NAME" < "$f"
          done

          echo "${#FILES[@]} SQL-script(s) kørt."
          REMOTE

      # (Registry-nøglen ryddes i "Pull image on server" — se `trap` dér. Der er
      # med vilje IKKE et logout-trin her til sidst: nøglen skal ikke ligge på
      # boksen gennem drift-gate, migrationer og genstart, når intet efter
      # pullet har brug for registret.)

      - name: Reload Caddy
        if: inputs.reload_caddy == 'always' || (inputs.reload_caddy == 'non-dev' && inputs.environment != 'dev')
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "root@${HOST}" \
            "docker exec ferm-caddy caddy reload --config /etc/caddy/Caddyfile"

      # Rapportér deployet til DevHub (devhubs mønster, docs/version-patch.md).
      # Må ALDRIG vælte et deploy — continue-on-error + '|| true', og springes
      # over hvis secrets ikke er sat i repoet.
      - name: Report deployment to DevHub
        if: always()
        continue-on-error: true
        env:
          DEVHUB_URL: ${{ secrets.DEVHUB_URL }}
          DEVHUB_DEPLOY_TOKEN: ${{ secrets.DEVHUB_DEPLOY_TOKEN }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          [ -n "$DEVHUB_URL" ] && [ -n "$DEVHUB_DEPLOY_TOKEN" ] || { echo "DevHub reporting not configured — skipping"; exit 0; }
          curl -fsS -m 10 -X POST "$DEVHUB_URL/api/deployments" \
            -H "authorization: Bearer $DEVHUB_DEPLOY_TOKEN" \
            -H "content-type: application/json" \
            -d "$(printf '{"app":"%s","env":"%s","sha":"%s","ref":"%s","status":"%s","actor":"%s","runUrl":"%s"}' \
                  "${{ inputs.app_slug }}" "$DEPLOY_ENV" "$GIT_SHA" "$GIT_REF" "$DEPLOY_STATUS" \
                  "${{ github.actor }}" \
                  "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")" \
            || true
