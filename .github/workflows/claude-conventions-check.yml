name: Claude Conventions Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'claude/**'

jobs:
  lint-skills:
    name: Lint skills
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Validate SKILL.md frontmatter
        run: |
          set -euo pipefail
          ERRORS=0

          for skill_md in claude/skills/*/SKILL.md; do
            skill_dir=$(dirname "$skill_md")
            skill_name=$(basename "$skill_dir")

            # Skip hidden dirs (e.g. .claude-plugin)
            [[ "$skill_name" == .* ]] && continue

            if ! grep -q "^name:" "$skill_md"; then
              echo "FAIL $skill_md — missing 'name:' frontmatter"
              ERRORS=$((ERRORS + 1))
            else
              actual_name=$(grep "^name:" "$skill_md" | head -1 | sed 's/^name:[[:space:]]*//')
              if [ "$actual_name" != "$skill_name" ]; then
                echo "FAIL $skill_md — name '$actual_name' does not match directory '$skill_name'"
                ERRORS=$((ERRORS + 1))
              fi
            fi

            if ! grep -q "^description:" "$skill_md"; then
              echo "FAIL $skill_md — missing 'description:' frontmatter"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ "$ERRORS" -eq 0 ]; then
            echo "All skills passed validation"
          else
            echo "$ERRORS error(s) found"
            exit 1
          fi

  review-conventions:
    name: Review conventions (AI)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install anthropic

      - name: Review Claude conventions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/claude-conventions-check.py
