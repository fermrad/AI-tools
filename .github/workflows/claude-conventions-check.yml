name: Claude Conventions Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'claude/**'

jobs:
  lint-skills:
    name: Lint skills (pulser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run pulser skill linter
        # pulser checks SKILL.md files for: valid frontmatter, required fields (name, description),
        # description trigger quality, file-size limits, and cross-skill conflicts.
        # Docs: https://github.com/TheStack-ai/pulser
        run: npx --yes pulser claude/skills

  review-conventions:
    name: Review conventions (AI)
    runs-on: ubuntu-latest
    if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install anthropic

      - name: Review Claude conventions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/claude-conventions-check.py
