name: PR Preview — Cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to tear down"
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    secrets:
      DEV_SSH_HOST:
        required: true
      DEV_SSH_KEY:
        required: true

jobs:
  cleanup:
    name: Tear down preview for PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest

    steps:
      - name: Stop containers and remove Nginx blocks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: root
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: PR_NUMBER
          script: |
            set -e

            # Stop and remove all containers for this PR (all apps)
            for APP in crm komm risk; do
              COMPOSE_PROJECT="preview-pr${PR_NUMBER}-${APP}"
              WORKDIR="/opt/previews/pr-${PR_NUMBER}-${APP}"

              if [ -d "$WORKDIR" ]; then
                cd "$WORKDIR/apps/${APP}" 2>/dev/null && \
                  docker compose -p "$COMPOSE_PROJECT" down -v 2>/dev/null || true
                rm -rf "$WORKDIR"
                echo "Removed $WORKDIR"
              fi

              # Remove Nginx block
              sed -i "/# PREVIEW pr-${PR_NUMBER}-${APP}/,/# END PREVIEW pr-${PR_NUMBER}-${APP}/d" \
                /opt/previews/nginx-previews.conf 2>/dev/null || true
            done

            # Reload Nginx
            docker exec ferm-preview-nginx nginx -t && \
              docker exec ferm-preview-nginx nginx -s reload || true
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
