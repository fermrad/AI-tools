# Kører testen af deploy-app.yml's backup-trin på PR'er, der rører workflowet
# eller scriptet selv.
#
# Findes fordi repoets eneste CI (claude-conventions-check) kun kigger på
# `claude/**`. Den delte deploy-workflow — den ene fil, der kan tage backup fra
# alle Ferm-apps på én gang — havde altså ingen automatiske tjek overhovedet.
# Det er sådan S-211 kunne leve i tre uger: trinnet valgte forkert container,
# sprang backup over og rapporterede grønt, og intet kørte nogensinde imod det.
name: Deploy workflow test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/deploy-app.yml'
      # backup-db.yml kører den samme backup-krop på en schedule (S-243), og
      # testen kræver at de to kroppe er identiske. Uden stien her kunne en PR,
      # der kun rører backup-db.yml, indføre præcis den drift, testen findes for.
      - '.github/workflows/backup-db.yml'
      - '.github/workflows/deploy-workflow-test.yml'
      - 'scripts/test-deploy-backup.sh'
      - 'scripts/test-deploy-remote-quoting.sh'
      - 'scripts/test-deploy-diskvagt-byggecache.sh'

jobs:
  backup-step:
    name: Backup-trinnet i deploy-app.yml og backup-db.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Workflowene skal være gyldig YAML
        run: |
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/deploy-app.yml'))"
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/backup-db.yml'))"

      - name: Test backup-trinnet
        run: bash scripts/test-deploy-backup.sh

      # S-354 punkt 2: et branchnavn må ikke kunne køre kode som root på
      # målserveren. Testen kører trinnene mod en falsk ssh og måler BÅDE at
      # prøven ikke eksekverer, OG at de variabler, der skal ekspandere,
      # stadig gør — en citering, der lukker hullet og brækker udrulningen,
      # er ikke en rettelse.
      - name: Test citeringen ind i den fjerne shell
        run: bash scripts/test-deploy-remote-quoting.sh

  diskvagt-byggecache:
    name: Byggecache-oprydningen i diskvagten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      # Eget job og ikke et trin mere ovenfor: denne test kan ikke stubbes.
      # Hele reglen fra S-365 — "De interne bokse bærer 42 GB byggecache —
      # S-362's oprydning rører dem med vilje ikke" — hviler på, at buildkits
      # `--filter until=` snitter på hvornår en cachepost SIDST BLEV BRUGT og
      # ikke på hvornår den blev SKABT. Det kan kun en rigtig dæmon svare på,
      # og runneren har én.
      #
      # ENGANGSDAEMON: testen kalder GLOBALE prunes og nægter derfor at køre
      # på en maskine med byggecache, den ikke selv har lavet. Runneren er
      # brug-og-smid-væk, så her er svaret ja.
      - name: Test byggecache-oprydningen mod en rigtig docker-dæmon
        env:
          DISKVAGT_TEST_ENGANGSDAEMON: '1'
        run: bash scripts/test-deploy-diskvagt-byggecache.sh
