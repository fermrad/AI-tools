name: Build ferm-setup

# Builds cross-platform binaries and publishes a GitHub release.
# The version is read from claude/setup-tool/VERSION.
#
# - Same version as existing release → overwrites binaries in that release.
# - Newer version → creates a new release.
# - Older version → blocked by the check-setup-tool-version PR check.
#
# Triggers:
#   push to main touching claude/**  — automatic (runs after merge)
#   workflow_dispatch                — manual trigger (uses VERSION from checked-out branch)
#
# Required secrets:
#   FERM_SETUP_OAUTH_CLIENT_ID — GitHub OAuth App Client ID (org secret)

on:
  push:
    branches: [main]
    paths: ["claude/**"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            zip: true
          - goos: darwin
            goarch: amd64
            suffix: ""
            zip: true
          - goos: darwin
            goarch: arm64
            suffix: ""
            zip: true
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            zip: false

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(cat claude/setup-tool/VERSION | tr -d '[:space:]')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=ferm-setup/v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version ${VERSION}"

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: claude/setup-tool/go.mod

      - name: Bundle skills
        # Copies claude/skills/*/SKILL.md into bundled/ so //go:embed picks them up.
        # Each release captures the exact skills at this commit.
        run: |
          mkdir -p claude/setup-tool/bundled/skills
          for dir in claude/skills/*/; do
            name=$(basename "$dir")
            [[ "$name" == .* ]] && continue
            [ -f "${dir}SKILL.md" ] || continue
            mkdir -p "claude/setup-tool/bundled/skills/${name}"
            cp "${dir}SKILL.md" "claude/setup-tool/bundled/skills/${name}/SKILL.md"
          done
          echo "Bundled skills:"
          find claude/setup-tool/bundled/skills -name "SKILL.md" | sort

      - name: Download dependencies
        working-directory: claude/setup-tool
        run: go mod tidy && go mod download

      - name: Build
        working-directory: claude/setup-tool
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          OAUTH_CLIENT_ID: ${{ secrets.FERM_SETUP_OAUTH_CLIENT_ID }}
        run: |
          BINARY="ferm-setup-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build \
            -ldflags="-s -w -X main.githubClientID=${OAUTH_CLIENT_ID}" \
            -o "$BINARY" .
          echo "BINARY=$BINARY" >> $GITHUB_ENV

      - name: Package (zip preserves executable bit on macOS/Linux)
        working-directory: claude/setup-tool
        run: |
          if [ "${{ matrix.zip }}" = "true" ]; then
            chmod +x "$BINARY"
            zip "${BINARY}.zip" "$BINARY"
            echo "ASSET=${BINARY}.zip" >> $GITHUB_ENV
          else
            echo "ASSET=${BINARY}" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferm-setup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: claude/setup-tool/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(cat claude/setup-tool/VERSION | tr -d '[:space:]')"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=ferm-setup/v${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Move tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git tag -f "$TAG"
          git push --force origin "$TAG"

          NOTES="## ferm-setup v${VERSION}

          One-command developer setup tool for the Fermrad org. No prerequisites — just download and run.

          ### Download

          | Platform | File |
          |---|---|
          | macOS (Apple Silicon) | \`ferm-setup-darwin-arm64.zip\` |
          | macOS (Intel) | \`ferm-setup-darwin-amd64.zip\` |
          | Linux | \`ferm-setup-linux-amd64.zip\` |
          | Windows | \`ferm-setup-windows-amd64.exe\` |

          ### Usage

          **macOS / Linux:** Download the \`.zip\`, double-click to extract, then right-click the binary → Open.

          **Windows:** Download the \`.exe\` and double-click to run."

          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            gh release edit "$TAG" \
              --title "ferm-setup v${VERSION}" \
              --notes "$NOTES"
            gh release upload "$TAG" dist/* --clobber
            echo "ACTION=Updated" >> $GITHUB_ENV
          else
            gh release create "$TAG" \
              --title "ferm-setup v${VERSION}" \
              --notes "$NOTES" \
              dist/*
            echo "ACTION=Created" >> $GITHUB_ENV
          fi

      - name: Summary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          {
            echo "## ${ACTION} release: ferm-setup v${VERSION}"
            echo ""
            echo "**[View release →](${RELEASE_URL})**"
            echo ""
            echo "### Download links"
            echo "| Platform | Link |"
            echo "|---|---|"
            echo "| macOS (Apple Silicon) | [ferm-setup-darwin-arm64.zip](${BASE}/ferm-setup-darwin-arm64.zip) |"
            echo "| macOS (Intel)         | [ferm-setup-darwin-amd64.zip](${BASE}/ferm-setup-darwin-amd64.zip) |"
            echo "| Linux                 | [ferm-setup-linux-amd64.zip](${BASE}/ferm-setup-linux-amd64.zip) |"
            echo "| Windows               | [ferm-setup-windows-amd64.exe](${BASE}/ferm-setup-windows-amd64.exe) |"
          } >> $GITHUB_STEP_SUMMARY
