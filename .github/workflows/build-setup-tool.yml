name: Build ferm-setup

# Builds cross-platform binaries and publishes GitHub releases.
#
# Beta (automatic):
#   Triggered whenever anything under claude/ merges to main.
#   Creates/overwrites the rolling "ferm-setup/beta" pre-release.
#
# Stable (manual):
#   Run workflow_dispatch from main with a version (e.g. v1.2.0).
#   Creates a permanent "ferm-setup/v1.2.0" release.
#
# Required secrets:
#   FERM_SETUP_OAUTH_CLIENT_ID — GitHub OAuth App Client ID (org secret)

on:
  push:
    branches: [main]
    paths: ["claude/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version for stable release (e.g. v1.2.0)"
        required: true
        type: string

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
            zip: true
          - goos: darwin
            goarch: amd64
            suffix: ""
            zip: true
          - goos: darwin
            goarch: arm64
            suffix: ""
            zip: true
          - goos: windows
            goarch: amd64
            suffix: ".exe"
            zip: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: claude/setup-tool/go.mod

      - name: Bundle skills
        # Copies claude/skills/*/SKILL.md into the setup-tool's bundled/ dir
        # so //go:embed picks them up. Each release captures the exact skills
        # at this commit.
        run: |
          mkdir -p claude/setup-tool/bundled/skills
          for dir in claude/skills/*/; do
            name=$(basename "$dir")
            [[ "$name" == .* ]] && continue
            [ -f "${dir}SKILL.md" ] || continue
            mkdir -p "claude/setup-tool/bundled/skills/${name}"
            cp "${dir}SKILL.md" "claude/setup-tool/bundled/skills/${name}/SKILL.md"
          done
          echo "Bundled skills:"
          find claude/setup-tool/bundled/skills -name "SKILL.md" | sort

      - name: Download dependencies
        working-directory: claude/setup-tool
        run: go mod tidy && go mod download

      - name: Build
        working-directory: claude/setup-tool
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          OAUTH_CLIENT_ID: ${{ secrets.FERM_SETUP_OAUTH_CLIENT_ID }}
        run: |
          BINARY="ferm-setup-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build \
            -ldflags="-s -w -X main.githubClientID=${OAUTH_CLIENT_ID}" \
            -o "$BINARY" .
          echo "BINARY=$BINARY" >> $GITHUB_ENV

      - name: Package (zip preserves executable bit on macOS/Linux)
        working-directory: claude/setup-tool
        run: |
          if [ "${{ matrix.zip }}" = "true" ]; then
            chmod +x "$BINARY"
            zip "${BINARY}.zip" "$BINARY"
            echo "ASSET=${BINARY}.zip" >> $GITHUB_ENV
          else
            echo "ASSET=${BINARY}" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferm-setup-${{ matrix.goos }}-${{ matrix.goarch }}
          path: claude/setup-tool/${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=ferm-setup/${{ inputs.version }}"    >> $GITHUB_OUTPUT
            echo "name=ferm-setup ${{ inputs.version }}"   >> $GITHUB_OUTPUT
            echo "prerelease=false"                         >> $GITHUB_OUTPUT
          else
            echo "tag=ferm-setup/beta"                      >> $GITHUB_OUTPUT
            echo "name=ferm-setup (beta)"                   >> $GITHUB_OUTPUT
            echo "prerelease=true"                          >> $GITHUB_OUTPUT
          fi

      - name: Move beta tag to current commit
        if: github.event_name == 'push'
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git tag -f ferm-setup/beta
          git push --force origin ferm-setup/beta

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: dist/*
          body: |
            ## ferm-setup

            One-command developer setup tool for the Fermrad org. No prerequisites — just download and run.

            ### Download

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `ferm-setup-darwin-arm64.zip` |
            | macOS (Intel) | `ferm-setup-darwin-amd64.zip` |
            | Linux | `ferm-setup-linux-amd64.zip` |
            | Windows | `ferm-setup-windows-amd64.exe` |

            ### Usage

            **macOS / Linux:** Download the `.zip`, double-click to extract, then right-click the binary → Open.

            **Windows:** Download the `.exe` and double-click to run.
