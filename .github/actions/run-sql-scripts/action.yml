name: Run SQL scripts
description: >
  Kører app-repoets scripts/sql/*.sql mod databasen — det Prisma ikke ejer.

# Hvorfor det her trin findes
#
# `prisma db push` synkroniserer tabeller, kolonner, indeks og fremmednøgler.
# Den kender IKKE CHECK-constraints, partielle indeks, triggere eller
# exclusion-constraints, og `scripts/schema-drift.mjs` ser dem heller ikke.
# Det gør dem robuste (de overlever ethvert deploy), men betyder også, at de
# aldrig kommer af sig selv: et nyt miljø har dem først, når nogen husker at
# køre dem i hånden. Præcis det "nogen husker" er hullet her lukker.
#
# Første konkrete tilfælde: devhubs `comment_exactly_one_target` — en kommentar
# skal hænge på præcis ét af feedback / arbejdspakke / sprint-punkt. Uden
# constrainten ville en forældreløs kommentar være helt usynlig, fordi hver
# læsevej går gennem en relation.
#
# Kontrakten med app-repoet
#
#   * Filerne ligger i `scripts/sql/` og køres i navnesorteret rækkefølge
#     (LC_ALL=C), så et præfiks som 010-, 020- styrer rækkefølgen.
#   * De køres ved HVERT deploy, i alle miljøer. De SKAL derfor være
#     idempotente — typisk `if not exists (...) then ... end if` eller
#     `create ... if not exists`. Et script, der kun kan køres én gang, brækker
#     det næste deploy.
#   * De skal være additive. Der er ingen drift-gate på dem: gaten kigger på
#     Prismas diff, og den ser ikke det her. Hører ændringen til noget
#     tabsgivende, hører den til en manuel, gennemtænkt kørsel.
#   * Ingen mappe = intet at gøre. Trinnet er en no-op for de apps, der ikke
#     bruger det, så det kan ligge i den fælles workflow uden at kræve noget.

inputs:
  host:
    description: 'Serverens host (SSH-mål, uden root@)'
    required: true
  app_dir:
    description: 'Deploy-mappen på serveren, fx /opt/ferm-devhub'
    required: true
  db_container:
    description: 'Postgres-containerens navn'
    required: true
  db_user:
    required: true
  db_name:
    required: true
  ssh_key:
    description: 'Sti til deploy-nøglen på runneren'
    required: false
    default: '~/.ssh/deploy_key'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        ssh -i ${{ inputs.ssh_key }} -o BatchMode=yes "root@${{ inputs.host }}" \
          bash -s -- "${{ inputs.app_dir }}" "${{ inputs.db_container }}" \
                     "${{ inputs.db_user }}" "${{ inputs.db_name }}" << 'REMOTE'
        set -euo pipefail
        APP_DIR="$1"; DB_CONTAINER="$2"; DB_USER="$3"; DB_NAME="$4"
        SQL_DIR="$APP_DIR/scripts/sql"

        if [ ! -d "$SQL_DIR" ]; then
          echo "Ingen $SQL_DIR — intet SQL at køre."
          exit 0
        fi

        # nullglob: en tom mappe skal give en tom liste, ikke den bogstavelige
        # streng "*.sql" som psql så ville fejle på.
        shopt -s nullglob
        FILES=("$SQL_DIR"/*.sql)
        shopt -u nullglob

        if [ ${#FILES[@]} -eq 0 ]; then
          echo "Ingen .sql-filer i $SQL_DIR — intet at køre."
          exit 0
        fi

        if ! docker ps --format '{{.Names}}' | grep -qx "$DB_CONTAINER"; then
          echo "$DB_CONTAINER kører ikke — kan ikke køre SQL." >&2
          exit 1
        fi

        # LC_ALL=C: samme rækkefølge uanset serverens locale, så 010- før 020-
        # også holder, hvis en boks har et andet sprog sat.
        IFS=$'\n' FILES=($(printf '%s\n' "${FILES[@]}" | LC_ALL=C sort))

        for f in "${FILES[@]}"; do
          echo "── $(basename "$f")"
          # ON_ERROR_STOP=1 er IKKE valgfri: uden den fortsætter psql efter en
          # fejl og afslutter med 0, så et brækket script ville rulle videre
          # som om alt gik godt — endnu et falsk-grønt signal.
          docker exec -i "$DB_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" < "$f"
        done

        echo "${#FILES[@]} SQL-script(s) kørt."
        REMOTE
